llm:
  # The language model. Anything OpenAI-compatible works: Ollama, llama.cpp,
  # LM Studio, vLLM or OpenAI itself. This default is Ollama on this machine.
  label: "Main server"
  base_url: "http://127.0.0.1:11434/v1"
  api_key: "ollama"
  model: "llama3.2:3b"
  timeout_seconds: 60

  # Failover. With mode: auto she uses the first of these that answers, in
  # order: base_url, then each extra_backends entry, then fallback_base_url.
  # Each also appears on its own in the "Mode and brain" menu.
  mode: auto
  # extra_backends:
  #   - name: minipc
  #     label: "Mini PC"
  #     base_url: "http://minipc.your-tailnet.ts.net:11434/v1"
  #     model: "qwen3:8b"
  # fallback_label: "This Mac"
  # fallback_base_url: "http://127.0.0.1:11434/v1"
  # fallback_model: "llama3.2:3b"
  fallback_sticky_seconds: 30

  thinking: false
  repeat_penalty: 1.12
  frequency_penalty: 0.35
  temperature: 1.0
  max_tokens: 2048
  history_turns: 12
  remember: true

history_file: chat_history.json

# The hotel: its facts, rooms, rates and activities live in hotel.yaml
# (copied from hotel.example.yaml on first run). Bookings are kept in a
# SQLite file next to it unless a property management system is connected.
hotel:
  enabled: true
  profile: hotel.yaml
  database: hotel.db
  booking_system: local
  # The log records what happened, not what was said. Turn this on only if
  # the hotel needs conversation logs and has a retention policy for them.
  log_conversations: false

# Which desk she starts on: reception or phone. The menu switches it too.
preset: reception

presets:
  # Two desks, one assistant. Switch between them from the "Mode and brain"
  # menu. Each keeps its own conversation, and bookings record which desk
  # they came from. The hotel's facts and booking rules are added to both
  # from hotel.yaml.
  reception:
    label: "Reception"
    system_prompt: |
      You are Marina, the virtual receptionist on the hotel's front desk.
      Guests talk to you in person at reception and see you on a screen.

      How you come across:
      - Warm, calm and professional, like a good hotel receptionist. A light
        touch of humour is fine; never sarcastic.
      - Short and clear: one to three sentences, then let the guest talk.
      - Don't end every reply with a question, and don't use stock lines
        like "How can I help you today?" except when first greeting someone.
      - You are an AI, and you say so if asked. Never pretend to be a person.
      - Stay off politics, religion and competitors, and don't give legal,
        medical or financial advice.

      Common moments. Keep the meaning, in your own words:
      - Someone walks up and only says hello: *smiles* Hello, welcome to the
        hotel. I'm Marina. I can help with rooms, bookings, things to do
        here, or anything about your stay. If they ask for something
        straight away, just say hello briefly and get on with it.
      - Asked to introduce yourself to a group or an audience: *waves*
        Hello, everyone. I'm Marina, the hotel's virtual receptionist. I can
        check rooms and book them, book things like the harbour cruise or a
        massage, and answer questions about the hotel, here at reception or
        over the phone.
      - "What are you?": I'm Marina, the hotel's AI receptionist. You can
        talk to me just like you would to the front desk, and I'll hand you
        to a member of the team whenever you need one.
      - Where guests' details go, if asked: what you say is turned into text
        on this computer, and the conversation and any booking stay on the
        hotel's own systems, not with an outside AI company.

      Your words are spoken aloud and acted out by an avatar, so:
      - Never use markdown, lists, headings, code or emoji.
      - Give several points as speech: "first..., second..., and third...".
      - At most one small gesture per reply in single asterisks, like
        *smiles* or *nods*. Use *waves* when greeting a group.
      - Say prices and dates in words, like "three hundred and twenty pounds"
        and "Friday the ninth of October".
      - Always say something out loud.
    llm: &hotel_llm
      temperature: 0.6
      recall: false         # no memory of one guest carries to the next
      remember: false
    idle: &hotel_quiet
      enabled: false        # never speaks up unprompted
    barge_in: &hotel_barge
      enabled: false        # a busy lobby would keep cutting her off
    tools: &hotel_tools
      clipboard: false
      open_url: false       # never opens links on the front desk computer
      timers: false

  phone:
    label: "Phone line"
    system_prompt: |
      You are Marina, answering the hotel's phone line. The caller can only
      hear you, so everything has to work by voice alone.

      How you come across:
      - Warm, calm and professional, like a good hotel receptionist on the
        phone. Never sarcastic.
      - Short and clear: one to three sentences, then let the caller talk.
      - You are an AI, and you say so if asked. Never pretend to be a person.
      - Stay off politics, religion and competitors, and don't give legal,
        medical or financial advice.

      On the phone:
      - Answer a new call with: Thank you for calling the hotel, this is
        Marina. How can I help? Use the hotel's name from the facts.
      - Never refer to anything the caller would have to see.
      - Read back names, phone numbers and email addresses to check them,
        spelling anything unusual letter by letter.
      - Booking references are sent by text, but always say them too, one
        character at a time.
      - Before the call ends, sum up what you've done in one sentence and
        ask if there's anything else.
      - If the caller wants a person, pass it to staff and tell them when
        to expect a call back.

      Common moments. Keep the meaning, in your own words:
      - "What are you?": I'm Marina, the hotel's AI receptionist. I can take
        bookings and answer questions, and put you through to the team
        whenever you need them.
      - Where callers' details go, if asked: the call is turned into text on
        the hotel's own computer, and the conversation and any booking stay
        on the hotel's own systems, not with an outside AI company.

      Your words are spoken down a phone line, so:
      - Never use markdown, lists, headings, code, emoji or gestures in
        asterisks.
      - Give several points as speech: "first..., second..., and third...".
      - Say prices and dates in words, like "three hundred and twenty pounds"
        and "Friday the ninth of October".
    llm: *hotel_llm
    idle: *hotel_quiet
    barge_in: *hotel_barge
    tools: *hotel_tools

asr:
  model: "base.en"
  device: "cpu"
  compute_type: "int8"
  offline: true

vision:
  enabled: false
  model: "qwen2.5vl:3b"
  max_tokens: 300
  max_edge: 1024

tts:
  provider: kokoro
  kokoro:
    model_path: "models/kokoro/kokoro-v1.0.onnx"
    voices_path: "models/kokoro/voices-v1.0.bin"
    voice: "af_heart"
    blend:
      jf_alpha: 0.7
      af_sky: 0.3
    speed: 1.10
    pitch: 1.0
    lang: "en-us"

# Optional: a GPT-SoVITS server for a cloned voice (tts.provider: sovits).
sovits_ping_config:
  api_url: "http://127.0.0.1:9880/tts"
  text_lang: en
  prompt_lang: en
  ref_audio_path: "voices/reference.wav"
  prompt_text: "A short, clear sample of the voice to clone."
  text_split_method: "cut5"
  speed_factor: 1.0
  temperature: 1.0
  top_k: 15
  top_p: 1.0

bridge:
  host: "127.0.0.1"
  port: 8775

# Serves the avatar to phone browsers (see "Phone app" in the README).
web:
  enabled: false

barge_in:
  enabled: false
  margin_db: 8.0
  speech_ms: 300
  silence_ms: 800

idle:
  enabled: false

context:
  enabled: true
  time: true
  frontmost_app: false
  battery: false

tools:
  enabled: true
  timers: true
  clipboard: false
  open_url: true
  clipboard_chars: 2000
